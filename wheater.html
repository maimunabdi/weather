<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      background: url(./weather.jpg);
      background-color: rgb(14, 14, 15);
  
    }
    input, button {
      padding: 10px;
      margin-top: 60px;
    }
    .weather {
      margin-top: 20px;
      font-size: 20px;
    }
    img {
      width: 100px;
      height: 100px;
    }
    .container{
        margin: auto;
    }
   
       
        
   
  </style>
</head>
<body>
   <section class="container">
    <div>
        <h1>Weather App</h1>
  <input type="text" id="city" placeholder="Enter City">
  <button onclick="getWeather()">Get Weather</button>

  <div class="weather" id="weather-info"></div>
  <div id="weather-icon"></div> <!-- Sawirka xaaladda cimilada -->
    </div>
    </section>
  <script>
    function getWeather() {
      const city = document.getElementById('city').value;
      const apiKey = '6b79c791c5089d329054d256e6c92791';  // API key-gaaga cusub
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          const weatherInfo = document.getElementById('weather-info');
          const weatherIcon = document.getElementById('weather-icon');
          if (data.cod === 200) {
            const temp = data.main.temp;
            const description = data.weather[0].description;
            const iconCode = data.weather[0].icon;
            const iconUrl = `https://openweathermap.org/img/wn/${iconCode}.png`; // URL-ka sawirka cimilada

            weatherInfo.innerHTML = ` city🏙️:${city}<br>Temperature😎: ${temp}°C<br>Description: ${description}`;
            weatherIcon.innerHTML = `<img src="${iconUrl}" alt="${description}">`;  // Ku dar sawirka
          } else {
            weatherInfo.innerHTML = 'City not found or error occurred!';
            weatherIcon.innerHTML = '';  // Haddii ay jirto qalad, sawirka ha muuqan
          }
        })
        .catch(err => {
          console.error('Error:', err);
          alert('Something went wrong!');
        });
    }
  </script>
</body>
</html>
